site_name: Hoobs Live
site_description: Official Hoobs Live & BlexBot Customer Help Manual
site_url: https://help.hoobs.live/

theme:
  name: material
  font: false
  logo: img/logo.svg
  favicon: img/favicon.ico
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: red
  features:
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
    - Handbook & Commands: index.md
    - Livestream & Economy:
      - Viewer Ranks & Milestones: stream/ranks.md
      - Economy & Bonuses: stream/economy.md
      - Code Wheel & Buffs: stream/wheel-buffs.md
    - Minecraft Server:
      - Connecting: server/connecting.md
      - Claims & Land: server/claims.md
      - Custom 3D Skins: server/skins.md
      - Places & Spectating: server/places.md
      - Clans: server/clans.md
    - Lore & Bosses:
      - Hoobasaurus: lore/hoobasaurus.md
      - Hooba's Mom: lore/hoobasmom.md
      - Hooba's Dad: lore/hoobasdad.md
      - Hoobibo: lore/hoobibo.md
    - Rules & Support:
      - Rules & Mods: rules/index.md
      - Discord Community: discord/index.md
      - Companion Web App: app.md
    - Privacy: privacy.md

extra_css:
  - stylesheets/extra.css
